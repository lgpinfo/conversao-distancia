apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: conversao-distancia
  namespace: producao
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: conversao-distancia
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
