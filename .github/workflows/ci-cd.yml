name: CI/CD Conversao-Distancia

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  DO_CLUSTER: k8s-1-36-3-do-2-nyc1-1788262016721
  IMAGE_NAME: lproenca/conversao-distancia

jobs:
  ci:
    name: Testes e validação de build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Rodar testes (pytest)
        run: pytest -v

      - name: Validar build da imagem Docker
        run: docker build -t conversao-distancia:ci-test .

  build-and-push:
    name: Build e publicação da imagem
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.sha_short }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Definir tag da imagem (SHA do commit)
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}

  deploy-homologacao:
    name: Deploy em Homologação
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: homologacao
    steps:
      - name: Instalar doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Conectar ao cluster
        run: doctl kubernetes cluster kubeconfig save ${{ env.DO_CLUSTER }}

      - name: Atualizar imagem do Deployment
        run: |
          kubectl set image deployment/conversao-distancia \
            conversao-distancia=${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }} \
            -n homologacao

      - name: Aguardar rollout
        run: kubectl rollout status deployment/conversao-distancia -n homologacao

  deploy-producao:
    name: Deploy em Produção
    needs: [build-and-push, deploy-homologacao]
    runs-on: ubuntu-latest
    environment: producao
    steps:
      - name: Instalar doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Conectar ao cluster
        run: doctl kubernetes cluster kubeconfig save ${{ env.DO_CLUSTER }}

      - name: Atualizar imagem do Deployment
        run: |
          kubectl set image deployment/conversao-distancia \
            conversao-distancia=${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }} \
            -n producao

      - name: Aguardar rollout
        run: kubectl rollout status deployment/conversao-distancia -n producao
