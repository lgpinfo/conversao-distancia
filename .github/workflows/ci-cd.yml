name: CI/CD Conversao-Distancia
run-name: Infraestrutura AWS via Terraform - Pipeline com EKS

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, aws]

env:
  IMAGE_NAME: lproenca/conversao-distancia

jobs:
  ci:
    name: Testes e validação de build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Rodar testes (pytest)
        run: pytest -v

      - name: Validar build da imagem Docker
        run: docker build -t conversao-distancia:ci-test .

  build-and-push:
    name: Build e publicação da imagem
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/aws')
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.sha_short }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Definir tag da imagem (SHA do commit)
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}

  deploy-homologacao:
    name: Deploy em Homologação
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: homologacao
    permissions:
      contents: write
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Atualizar tag da imagem no values (GitOps)
        run: |
          sed -i "s/^  tag: .*/  tag: ${{ needs.build-and-push.outputs.image_tag }}/" helm/conversao-distancia/values-homologacao.yaml

      - name: Commit e push da mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/conversao-distancia/values-homologacao.yaml
          git commit -m "Atualiza imagem de homologacao para ${{ needs.build-and-push.outputs.image_tag }} [skip ci]"
          git push

  deploy-producao:
    name: Deploy em Produção
    needs: [build-and-push, deploy-homologacao]
    runs-on: ubuntu-latest
    environment: producao
    permissions:
      contents: write
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Atualizar tag da imagem no values (GitOps)
        run: |
          sed -i "s/^  tag: .*/  tag: ${{ needs.build-and-push.outputs.image_tag }}/" helm/conversao-distancia/values-producao.yaml

      - name: Commit e push da mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/conversao-distancia/values-producao.yaml
          git commit -m "Atualiza imagem de producao para ${{ needs.build-and-push.outputs.image_tag }} [skip ci]"
          git push
