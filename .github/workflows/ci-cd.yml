name: CI/CD Conversao-Distancia
run-name: Infraestrutura AWS via Terraform - Pipeline com EKS

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, aws]

env:
  EKS_CLUSTER: eks-conversao-distancia
  AWS_REGION: us-east-1
  IMAGE_NAME: lproenca/conversao-distancia

jobs:
  ci:
    name: Testes e validação de build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Rodar testes (pytest)
        run: pytest -v

      - name: Validar build da imagem Docker
        run: docker build -t conversao-distancia:ci-test .

  build-and-push:
    name: Build e publicação da imagem
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/aws')
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.sha_short }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Definir tag da imagem (SHA do commit)
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}

  deploy-homologacao:
    name: Deploy em Homologação
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: homologacao
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Conectar ao cluster
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Aplicar manifesto com a imagem do build atual
        run: |
          sed -i "s|${{ env.IMAGE_NAME }}:.*|${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }}|" k8s/manifesto-homologacao.yaml
          kubectl apply -f k8s/manifesto-homologacao.yaml

      - name: Aplicar Ingress (domínio + TLS)
        run: kubectl apply -f k8s/ingress-homologacao-aws.yaml

      - name: Aguardar rollout
        run: kubectl rollout status deployment/conversao-distancia -n homologacao

  deploy-producao:
    name: Deploy em Produção
    needs: [build-and-push, deploy-homologacao]
    runs-on: ubuntu-latest
    environment: producao
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Conectar ao cluster
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Aplicar manifesto com a imagem do build atual
        run: |
          sed -i "s|${{ env.IMAGE_NAME }}:.*|${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }}|" k8s/manifesto-producao.yaml
          kubectl apply -f k8s/manifesto-producao.yaml

      - name: Aplicar Ingress (domínio + TLS)
        run: kubectl apply -f k8s/ingress-producao-aws.yaml

      - name: Aguardar rollout
        run: kubectl rollout status deployment/conversao-distancia -n producao
