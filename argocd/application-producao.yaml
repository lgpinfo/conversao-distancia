# Fase B/C/D do GitOps: conecta o ArgoCD ao chart do Helm, com sync
# automatico + self-heal ligados -- qualquer mudanca manual feita direto
# no cluster (kubectl edit) e desfeita automaticamente, revertendo pro
# que o Git declara.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: conversao-distancia-producao
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lgpinfo/conversao-distancia.git
    targetRevision: aws
    path: helm/conversao-distancia
    helm:
      valueFiles:
        - values-producao.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: producao
  syncPolicy:
    automated:
      selfHeal: true
